name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Audit, build and test
        shell: pwsh
        run: |
          ./scripts/build/build.ps1 -Target Audit
          ./scripts/build/build.ps1 -Target Test

      - name: Publish x64 and self-test the exe
        shell: pwsh
        run: ./scripts/build/build.ps1 -Target Publish -Runtime win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14
