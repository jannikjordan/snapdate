name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Audit, build and test
        shell: pwsh
        run: |
          ./scripts/build/build.ps1 -Target Audit
          ./scripts/build/build.ps1 -Target Test

      # Pull requests only build and self-test x64. On main the arm64 exe is built as well and
      # handed to the self-test-arm64 job, because the x64 runner cannot start it.
      - name: Publish and self-test the exe
        shell: pwsh
        env:
          RUNTIMES: ${{ github.event_name == 'push' && 'win-x64,win-arm64' || 'win-x64' }}
        run: ./scripts/build/build.ps1 -Target Publish -Runtime ($env:RUNTIMES -split ',')

      - name: Upload win-arm64 exe
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapdate-win-arm64
          path: artifacts/publish/win-arm64/Snapdate.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

  # Starts the arm64 exe on a real ARM64 Windows machine. Only on push to main to save runner
  # minutes; release.yml runs the same check on every tag.
  self-test-arm64:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: windows-11-arm
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapdate-win-arm64
          path: ${{ runner.temp }}/arm64-exe

      - name: Self-test the exe
        shell: pwsh
        run: |
          # Run from an empty folder so no stray DLL next to the working directory can be picked up.
          $sandbox = Join-Path $env:RUNNER_TEMP 'snapdate-selftest'
          New-Item -ItemType Directory -Path $sandbox | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'arm64-exe/Snapdate.exe') $sandbox
          $process = Start-Process -FilePath (Join-Path $sandbox 'Snapdate.exe') -ArgumentList '--self-test' `
            -WorkingDirectory $sandbox -PassThru -Wait -RedirectStandardError (Join-Path $sandbox 'stderr.txt')
          Get-Content (Join-Path $sandbox 'stderr.txt') -ErrorAction SilentlyContinue | Write-Host
          if ($process.ExitCode -ne 0) { throw "Self-test of win-arm64 failed with exit code $($process.ExitCode)." }
          Write-Host 'Self-test passed.'
