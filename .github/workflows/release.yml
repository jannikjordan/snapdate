name: Release

# Pushing a tag vX.Y.Z builds single-file executables, self-tests them (arm64 on a native ARM64
# runner) and creates a DRAFT release. A maintainer reviews the draft on GitHub and publishes it
# by hand.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check tag matches project version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ } | Select-Object -First 1
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match VersionPrefix $version." }

      - name: Install CycloneDX (SBOM)
        shell: pwsh
        run: dotnet tool install --global CycloneDX --version 6.3.1

      - name: Build release
        shell: pwsh
        env:
          SNAPDATE_SIGN_PFX: ${{ secrets.SNAPDATE_SIGN_PFX }}
          SNAPDATE_SIGN_PASSWORD: ${{ secrets.SNAPDATE_SIGN_PASSWORD }}
        # The update signature is a separate step below so the private key never reaches the build.
        run: ./scripts/build/build.ps1 -Target All -Version $env:TAG -SkipUpdateSignature

      # Detached ECDSA signatures (<file>.sig) that the app's updater verifies (ADR 0005). Only this
      # step sees the private key; the script verifies every signature against the key in the repo.
      - name: Sign release files for update verification
        shell: pwsh
        env:
          SNAPDATE_UPDATE_SIGNING_KEY: ${{ secrets.SNAPDATE_UPDATE_SIGNING_KEY }}
        run: ./scripts/build/build.ps1 -Target SignRelease -Version $env:TAG

      - name: Release notes from template
        shell: pwsh
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $notesArgs = @{ Version = $env:TAG; OutFile = 'artifacts/release-notes.md' }
          if ($env:REPO_PRIVATE -eq 'true') { $notesArgs.WithoutAttestation = $true }
          ./scripts/build/New-ReleaseNotes.ps1 @notesArgs

      # Hand the finished files to the draft-release job, which only runs after the arm64 self-test.
      # Two artefacts with a single path each, so the layout after download is unambiguous:
      # release-files holds the files (exe, zip, SHA256SUMS, SBOM and their .sig) at its root.
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload win-arm64 exe for the self-test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapdate-win-arm64
          path: artifacts/publish/win-arm64/Snapdate.exe
          if-no-files-found: error
          retention-days: 1

  # The x64 runner cannot start the arm64 exe, so it is started on a real ARM64 Windows machine.
  # Keep the self-test step in sync with Invoke-SelfTest in scripts/build/build.ps1 and with the
  # same job in ci.yml.
  self-test-arm64:
    needs: release
    runs-on: windows-11-arm
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapdate-win-arm64
          path: ${{ runner.temp }}/arm64-exe

      - name: Self-test the exe
        shell: pwsh
        run: |
          # Run from an empty folder so no stray DLL next to the working directory can be picked up.
          $sandbox = Join-Path $env:RUNNER_TEMP 'snapdate-selftest'
          New-Item -ItemType Directory -Path $sandbox | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'arm64-exe/Snapdate.exe') $sandbox
          $process = Start-Process -FilePath (Join-Path $sandbox 'Snapdate.exe') -ArgumentList '--self-test' `
            -WorkingDirectory $sandbox -PassThru -Wait -RedirectStandardError (Join-Path $sandbox 'stderr.txt')
          Get-Content (Join-Path $sandbox 'stderr.txt') -ErrorAction SilentlyContinue | Write-Host
          if ($process.ExitCode -ne 0) { throw "Self-test of win-arm64 failed with exit code $($process.ExitCode)." }
          Write-Host 'Self-test passed.'

  draft-release:
    needs: [release, self-test-arm64]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the draft GitHub Release
      id-token: write        # build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Layout after download: artifacts/release/<files> and artifacts/release-notes.md.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: artifacts/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: artifacts

      # Attested here, after the ARM64 self-test gate, so only files that passed it get provenance.
      # GitHub offers artifact attestations only for public (or organisation) repositories.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/*.exe
            artifacts/release/*.zip

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release create $env:TAG @files `
            --draft `
            --title "Snapdate $env:TAG" `
            --notes-file artifacts/release-notes.md `
            --verify-tag
