name: Release

# Pushing a tag vX.Y.Z builds single-file executables and Inno Setup installers, self-tests them (the
# x64 installer is installed, upgraded and uninstalled on the build runner; arm64 on a native ARM64
# runner) and creates a DRAFT release. A maintainer reviews the draft on GitHub and publishes it
# by hand.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# No long-lived build servers: they inherit the step's output pipes and keep a step from ever finishing.
env:
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_CLI_USE_MSBUILD_SERVER: '0'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  UseSharedCompilation: 'false'
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check tag matches project version
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup | ForEach-Object { $_.VersionPrefix } | Where-Object { $_ } | Select-Object -First 1
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match VersionPrefix $version." }

      - name: Install CycloneDX (SBOM)
        shell: pwsh
        timeout-minutes: 5
        run: dotnet tool install --global CycloneDX --version 6.3.1

      # Inno Setup builds the installers. Present on GitHub's Windows images; otherwise a pinned
      # version is installed.
      - name: Ensure Inno Setup
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/build/Ensure-InnoSetup.ps1

      # The release build is `build.ps1 -Target All` split into one step per stage (same order), each
      # with its own timeout, so a hang shows which stage it is in and does not eat the whole job.
      # build.ps1 prints a "==> [time]" banner per stage and kills any external process that exceeds
      # its own timeout. The update-signing key is NOT available to any of these steps (see below).
      - name: Audit NuGet packages
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/build/build.ps1 -Target Audit -Version $env:TAG

      - name: Build and test
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/build/build.ps1 -Target Test -Version $env:TAG

      - name: Publish and self-test the exes
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/build/build.ps1 -Target Publish -Version $env:TAG

      # Authenticode secrets only where they are needed: signing the exes here and the installers below.
      - name: Authenticode-sign the exes
        shell: pwsh
        timeout-minutes: 5
        env:
          SNAPDATE_SIGN_PFX: ${{ secrets.SNAPDATE_SIGN_PFX }}
          SNAPDATE_SIGN_PASSWORD: ${{ secrets.SNAPDATE_SIGN_PASSWORD }}
        run: ./scripts/build/build.ps1 -Target Sign -Version $env:TAG

      # Builds both installers (Authenticode-signed when a certificate is configured) and smoke-tests
      # the x64 one (silent install, upgrade, uninstall).
      - name: Build installers and smoke-test the x64 installer
        shell: pwsh
        timeout-minutes: 15
        env:
          SNAPDATE_SIGN_PFX: ${{ secrets.SNAPDATE_SIGN_PFX }}
          SNAPDATE_SIGN_PASSWORD: ${{ secrets.SNAPDATE_SIGN_PASSWORD }}
        run: ./scripts/build/build.ps1 -Target Installer -Version $env:TAG

      # Installers and portable exes, SHA256SUMS.txt and the SBOM into artifacts/release.
      - name: Package release files
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/build/build.ps1 -Target Package -Version $env:TAG

      # Detached ECDSA signatures (<file>.sig) that the app's updater verifies (ADR 0005). Only this
      # step sees the private key; the script verifies every signature against the key in the repo.
      - name: Sign release files for update verification
        shell: pwsh
        timeout-minutes: 5
        env:
          SNAPDATE_UPDATE_SIGNING_KEY: ${{ secrets.SNAPDATE_UPDATE_SIGNING_KEY }}
        run: ./scripts/build/build.ps1 -Target SignRelease -Version $env:TAG

      - name: Release notes from template
        timeout-minutes: 3
        shell: pwsh
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          $notesArgs = @{ Version = $env:TAG; OutFile = 'artifacts/release-notes.md' }
          if ($env:REPO_PRIVATE -eq 'true') { $notesArgs.WithoutAttestation = $true }
          ./scripts/build/New-ReleaseNotes.ps1 @notesArgs

      # Hand the finished files to the draft-release job, which only runs after the arm64 self-test.
      # Two artefacts with a single path each, so the layout after download is unambiguous:
      # release-files holds the files (installers, portable exes, SHA256SUMS, SBOM and their .sig) at its root.
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload win-arm64 exe for the self-test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapdate-win-arm64
          path: artifacts/publish/win-arm64/Snapdate.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload win-arm64 installer for the smoke test
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapdate-installer-win-arm64
          path: artifacts/installer/*-win-arm64.exe
          if-no-files-found: error
          retention-days: 1

  # The x64 runner cannot start the arm64 exe or installer, so they are started on a real ARM64
  # Windows machine. Keep the self-test step in sync with Invoke-SelfTest in scripts/build/build.ps1
  # and with the same job in ci.yml.
  self-test-arm64:
    needs: release
    runs-on: windows-11-arm
    timeout-minutes: 15
    permissions:
      contents: read         # checkout, for the installer smoke test in scripts/build/build.ps1
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapdate-win-arm64
          path: ${{ runner.temp }}/arm64-exe

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapdate-installer-win-arm64
          path: ${{ runner.temp }}/arm64-installer

      - name: Self-test the exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          # Run from an empty folder so no stray DLL next to the working directory can be picked up.
          $sandbox = Join-Path $env:RUNNER_TEMP 'snapdate-selftest'
          New-Item -ItemType Directory -Path $sandbox | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'arm64-exe/Snapdate.exe') $sandbox
          $process = Start-Process -FilePath (Join-Path $sandbox 'Snapdate.exe') -ArgumentList '--self-test' `
            -WorkingDirectory $sandbox -PassThru -Wait -RedirectStandardError (Join-Path $sandbox 'stderr.txt')
          Get-Content (Join-Path $sandbox 'stderr.txt') -ErrorAction SilentlyContinue | Write-Host
          if ($process.ExitCode -ne 0) { throw "Self-test of win-arm64 failed with exit code $($process.ExitCode)." }
          Write-Host 'Self-test passed.'

      # Silent per-user install, upgrade, uninstall of the arm64 installer (see Invoke-InstallerTest).
      - name: Smoke-test the installer
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'arm64-installer') -Filter 'Snapdate-Setup-*-win-arm64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'The arm64 installer was not downloaded.' }
          ./scripts/build/build.ps1 -Target InstallerTest -Version $env:TAG -InstallerPath $setup.FullName

      - name: Upload installer smoke-test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-test-logs-arm64
          path: artifacts/installer-test
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    needs: [release, self-test-arm64]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write        # create the draft GitHub Release
      id-token: write        # build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Layout after download: artifacts/release/<files> and artifacts/release-notes.md.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: artifacts/release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: artifacts

      # Attested here, after the ARM64 self-test gate, so only files that passed it get provenance.
      # GitHub offers artifact attestations only for public (or organisation) repositories.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/*.exe

      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem artifacts/release -File | ForEach-Object FullName
          gh release create $env:TAG @files `
            --draft `
            --title "Snapdate $env:TAG" `
            --notes-file artifacts/release-notes.md `
            --verify-tag
