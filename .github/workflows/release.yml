name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install CycloneDX (SBOM)
        shell: pwsh
        run: dotnet tool install --global CycloneDX

      - name: Build release
        shell: pwsh
        env:
          SNAPDATE_SIGN_PFX: ${{ secrets.SNAPDATE_SIGN_PFX }}
          SNAPDATE_SIGN_PASSWORD: ${{ secrets.SNAPDATE_SIGN_PASSWORD }}
        run: ./scripts/build/build.ps1 -Target All -Mode Aot -Version "${{ github.ref_name }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/release/*.exe
            artifacts/release/*.zip

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($ver))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Release $ver" }
          Set-Content -Path artifacts/release-notes.md -Value $notes -Encoding utf8NoBOM

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' artifacts/release/* `
            --title "Snapdate ${{ github.ref_name }}" `
            --notes-file artifacts/release-notes.md `
            --verify-tag
